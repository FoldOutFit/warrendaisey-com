    :root {
      --ink: #1D1B1D;
      --blush: #F6F2F0;
      --green: #004225;
      --burgundy: #7B101B;
      --white: #FFFFFF;
      --muted: rgba(246, 242, 240, 0.72);

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--ink);
      color: var(--blush);
      font-family: "Josefin Sans", sans-serif;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .skip {
      position: absolute;
      left: 1rem;

      background: var(--blush);
      color: var(--ink);

      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      z-index: 10;

      max-width: 28rem;
      padding: 2.75rem 1.25rem 2.5rem;
      flex: 1;

      flex-direction: column;
      align-items: center;

    .avatar {

      height: 7.5rem;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--blush);
      display: block;
    }

    h1 {
      font-family: "EB Garamond", Garamond, serif;
      font-weight: 600;
      font-size: clamp(2.15rem, 8vw, 2.75rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      margin: 1.35rem 0 0.35rem;
      line-height: 1.05;
      color: var(--blush);
    }
    h1 em {
      font-style: italic;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: none;
      display: inline-block;
    }

    .handle {
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      min-height: 3.5rem;
      padding: 0.95rem 1.25rem;
      background: var(--blush);
      color: var(--ink);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-weight: 600;
      font-size: 0.82rem;
      border: 1px solid var(--blush);
      border-radius: 0;
      line-height: 1.3;
      text-align: center;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .btn .arrow {
      font-family: "EB Garamond", Garamond, serif;
      font-style: italic;
      font-weight: 600;
      letter-spacing: 0;
      font-size: 1.15em;
    }
    .btn:hover,
    .btn:focus-visible {
      background: var(--green);
      border-color: var(--green);
      color: var(--blush);
      outline: none;
    }
    .btn:active {
      background: var(--burgundy);
      border-color: var(--burgundy);
      color: var(--white);
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 0.35rem;
      margin: 1.75rem 0 0;
    }
    .social {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 3rem;
      height: 3rem;
      color: var(--blush);
      text-decoration: none;
      border-radius: 0;
      transition: color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }
    .social:hover,
    .social:focus-visible {
      color: var(--blush);
      background: var(--green);
      outline: none;
    }
    .social svg {
      width: 1.55rem;
      height: 1.55rem;
      fill: currentColor;
      display: block;
    }

    .home {
      margin-top: 1.85rem;
      font-family: "EB Garamond", Garamond, serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--blush);
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .home:hover,
    .home:focus-visible {
      color: var(--white);
      text-decoration: underline;
      text-underline-offset: 0.2em;
      outline: none;
    }
    .home .arrow { font-style: italic; }

    footer {
      width: 100%;
      max-width: 28rem;
      padding: 0 1.25rem 2rem;
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media (min-width: 800px) {
      .page { padding-top: 4.25rem; }
    }
